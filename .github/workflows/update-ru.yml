name: Update RU content

# Русскоязычные назва/опис/характеристики почти не меняются — собираем их
# раз в неделю отдельным прогоном, а не каждый день вместе с основным
# (иначе основной прогон удвоился бы по времени без реальной пользы).
on:
  schedule:
    - cron: "0 5 * * 0"       # воскресенье, 05:00 по Києву, до основного прогону о 06:00
      timezone: "Europe/Kyiv"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-ru:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Write service-account key
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json

      # список URL (РУ) читаем прямо из таблицы (её каждый день обновляет
      # update.yml) — сайт заново не обходим, только рос. страницы
      - name: Fetch RU content
        run: python fetch_ru_content.py

      - name: Commit ru_content.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ru_content.json
          git diff --cached --quiet && exit 0
          git commit -m "Еженедельное обновление рос. версии (ru_content.json)"
          git push
